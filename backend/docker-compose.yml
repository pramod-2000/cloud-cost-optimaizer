services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ai-cloud-cost-detective-frontend
    ports:
      - "${FRONTEND_PORT:-4173}:4173"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - app-network
    environment:
      - VITE_API_URL=http://localhost:8000

  api:
    build: .
    container_name: ai-cloud-cost-detective-api
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  db:
    image: postgres:16-alpine
    container_name: ai-cloud-cost-detective-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_cloud_cost_detective}
      POSTGRES_USER: ${POSTGRES_USER:-ai_cost_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_cost_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
